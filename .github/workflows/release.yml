# Release.
#
# A tag is a release; a run started by hand is a rehearsal. Both build a binary
# for every supported platform and both report what would be published; only
# the tag creates the GitHub release and uploads the crates.
#
# This workflow is not reachable from a pull request — a fork cannot push a tag
# to this repository — which is why it may hold what `ci.yml` may not: the
# right to ask for a credential. `ci_needs_no_credential` draws that line by
# asking what a fork's pull request can reach, not by asking what file it is
# in.
#
# It holds no publishing secret. Every registry here takes this workflow's own
# identity instead: npm and crates.io exchange it for a token that lives
# minutes, the MCP registry for the `io.github.<owner>` namespace, and the
# container registry answers to `GITHUB_TOKEN`. What each of the first two was
# told about this repository is written down in
# `packaging/registry/trusted-publishers.toml`, and `rehearse` asks them
# whether they still agree before anything is created.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # `macos-13` was retired in December 2025. `macos-15-intel` is the
          # replacement and the last x86_64 macOS image GitHub will offer; it
          # goes away in August 2027, and this target goes with it.
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      # A tag names the version; a rehearsal takes it from the manifest. On a
      # tag the two have to agree, because a release whose archives are named
      # for one version and whose crates carry another is worse than no
      # release.
      - name: Settle the version
        shell: bash
        run: |
          manifest=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$manifest" ]; then
              echo "tag $GITHUB_REF_NAME does not match the manifest's $manifest" >&2
              exit 1
            fi
          else
            version="$manifest"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install the stable toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} --no-self-update && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # Only the server ships. `tailscale-stub` belongs to the tests and is
      # excluded from the published package as well.
      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p tailscale-mcp
      # One archive shape for all five, because `tar` is on every runner and a
      # second archiver written in another shell is a second thing to get
      # wrong. Windows can extract this since Windows 10.
      - name: Archive
        shell: bash
        run: |
          staging="tailscale-mcp-$VERSION-${{ matrix.target }}"
          mkdir "$staging"
          binary="target/${{ matrix.target }}/release/tailscale-mcp"
          [ -f "$binary.exe" ] && binary="$binary.exe"
          cp "$binary" README.md LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          echo "ARCHIVE=$staging.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  rehearse:
    name: Test and rehearse the publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # To ask npm and crates.io whether they would accept this workflow,
      # which is the same question the publishing jobs ask and the only way to
      # find out before they do.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # `ci.yml` runs on a push to main and on a pull request, and a tag is
      # neither, so without this a tag on a commit nobody tested would be
      # released. One platform: the matrix has already had both on main, and
      # what this catches is a tag pointing somewhere unexpected.
      - name: Test
        run: cargo test --workspace --all-targets --locked
      # Everything below asks a registry a question, and every one of them runs
      # on a rehearsal as well as on a tag. Nothing here needs a secret, so a
      # run started by hand is a real answer to "would a release work right
      # now" — which matters most for the trusted-publisher configurations,
      # because they are the part that can break with nobody touching this
      # repository: an owner renamed, a repository transferred, a
      # configuration tidied away on a settings page.
      #
      # The registry's own check of the listing, which needs no credential at
      # all. It was the first step of the publishing job; here it fails before
      # a GitHub release exists rather than three jobs after one does.
      - name: Check the MCP registry listing
        run: |
          scripts/install-mcp-publisher.sh
          ./mcp-publisher validate
      # crates.io mints a token for the run and this throws it away; the
      # action revokes it when the job ends. Getting one at all is the answer:
      # it means all three crates' configurations name this workflow.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      # npm has no action and no revoke, so this is the exchange by hand, and
      # the answer is the status code. The token that comes back is never
      # bound to a variable or written anywhere — `-o /dev/null` — so the
      # credential exists at the registry for its hour and nowhere else. A
      # `npm publish --dry-run` would be the obvious check and is the wrong
      # one: npm's OIDC helper is written never to throw, so a broken
      # configuration passes it with a warning (npm/cli#8525).
      - name: Check npm will accept this workflow
        run: |
          # A `run:` block is `bash -e`, which is neither of the two this
          # needs: without `pipefail` a failed `curl` into `jq` reports jq's
          # status, and `jq -r .value` of nothing succeeds and prints nothing —
          # so an unobtainable identity token would arrive at npm as an empty
          # one and be reported below as a trust configuration that is wrong.
          # `-u` catches the same thing one step earlier, where the identity
          # token's own variables are missing.
          set -euo pipefail
          package=$(jq -r .name packaging/npm/package.json)
          encoded=$(printf '%s' "$package" | jq -sRr @uri)
          id_token=$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" |
            jq -r .value)
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$encoded")
          if [ "$status" != 201 ]; then
            echo "npm answered $status for $package, not 201." >&2
            echo "Its trusted publisher must name ${GITHUB_REPOSITORY%%/*}," >&2
            echo "${GITHUB_REPOSITORY#*/} and release.yml, and must allow" >&2
            echo "npm publish. See packaging/registry/trusted-publishers.toml." >&2
            exit 1
          fi
      # Always, on a tag as well as by hand: it packages all three crates,
      # builds each from its package rather than from the working tree, and
      # names what it would upload — so the real thing is never the first time
      # any of that is tried. A run started by hand stops here.
      - name: Report what would be published
        run: cargo publish --workspace --dry-run --locked

  release:
    name: GitHub release
    needs: [build, rehearse]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # The one job here that writes anything to this repository.
      contents: write
      # And starts `notify-tap.yml`, because a release made with `GITHUB_TOKEN`
      # raises no event that would.
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Settle the version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # A bundle for each archive: the same binary, zipped with the manifest an
      # MCP client such as Claude Desktop installs by double-click. Building
      # them here rather than in the matrix keeps the assembly in one place and
      # off five runners, since it repacks what those runners already produced.
      - name: Assemble the plugin bundles
        run: |
          for archive in artifacts/*.tar.gz; do
            name=$(basename "$archive" .tar.gz)
            target="${name#tailscale-mcp-$VERSION-}"
            scripts/build-mcpb.sh "$target" "$archive" "artifacts/$name.mcpb"
          done
      # One `SHA256SUMS`, in the format `sha256sum -c` reads, so that anything
      # downloading a binary — the npm launcher included — has one file to
      # fetch and one line to check.
      - name: Checksum
        working-directory: artifacts
        run: sha256sum *.tar.gz *.mcpb > SHA256SUMS
      # The tap lives in another repository, so this renders the formula and
      # attaches it rather than pushing it: updating the tap is committing this
      # file there. It can only be written once the checksums exist, which is
      # why no formula is checked in.
      - name: Render the tap formula
        run: |
          scripts/update-formula.sh "$VERSION" artifacts/SHA256SUMS artifacts/tailscale-mcp.rb
          # Afterwards, and appended rather than recomputed: the formula is
          # written from the sums, so it cannot be in the file it reads.
          (cd artifacts && sha256sum tailscale-mcp.rb >> SHA256SUMS)
      # The notes are the changelog's newest section, taken out of the file
      # rather than generated again: a second generator run on a different day
      # would date the release differently from the file the repository ships,
      # and the release page and the changelog would disagree about the same
      # release. `scripts/prepare-release.sh` wrote that section, and
      # `release_is_one_version.rs` — which the job before this one ran —
      # checks it names the version going out.
      - name: Write the release notes
        run: |
          newest=$(grep -m1 '^## ' CHANGELOG.md | awk '{print $2}')
          if [ "$newest" != "$VERSION" ]; then
            echo "the changelog's newest release is $newest, not $GITHUB_REF_NAME" >&2
            exit 1
          fi
          awk '/^## /{n++; if (n>1) exit; next} n==1' CHANGELOG.md > NOTES.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file NOTES.md \
            --verify-tag \
            artifacts/*

      # `notify-tap.yml` listens for `release: published` and never heard one:
      # GitHub raises no workflow-triggering event for anything `GITHUB_TOKEN`
      # did, so that a workflow cannot set itself off, and the release above is
      # created with `GITHUB_TOKEN`. 1.0.3 went out with the tap still serving
      # 1.0.2 until somebody ran the poke by hand.
      #
      # `workflow_dispatch` is one of the two exceptions to that rule, so the
      # poke is asked for by name rather than waited for. It goes here because
      # the tap reads the formula and `SHA256SUMS` off the release, which the
      # step above has just attached — and nothing later in this workflow is
      # something the tap looks at.
      - name: Tell the tap there is a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run notify-tap.yml --ref "$GITHUB_REF_NAME"
          echo "asked notify-tap to poke the tap about $GITHUB_REF_NAME"

  npm:
    name: Publish to npm
    # After the release, because the package downloads the release's archives:
    # published first, it would be a package that fetches a 404 for as long as
    # the release job took.
    needs: release
    # Stated here rather than inherited through `needs:`, because the property
    # worth reading off this job is "it may mint a publishing credential", and
    # a reader should not have to follow a dependency chain to a condition on
    # another job to confirm it. Every publishing job below says the same.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The whole credential: npm exchanges this workflow's identity token for
      # a short-lived publishing token, so there is no secret to hold. It also
      # produces the provenance attestation, which is what lets somebody check
      # that this package was built from this repository by this workflow
      # rather than uploaded from a laptop.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # v7 and not v4: up to v6 this action exported `NODE_AUTH_TOKEN` as
      # `XXXXX-XXXXX-XXXXX-XXXXX` whenever the caller had not set one, so
      # removing the token from this job would have left an `.npmrc`
      # authenticating with a placeholder rather than with nothing. v7 exports
      # the variable only when it was actually given (actions/setup-node#1558).
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing wants npm 11.5.1 or newer, which wants Node
          # 22.14 or newer. `registry-url` stays — npm's own example keeps it —
          # and it writes the `.npmrc` line that names the registry.
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # Asked for rather than inherited. The npm a Node release bundles moves
      # with its patch releases, and the requirement here is a floor: dropping
      # under it does not say so, it fails the publish with a `404` that
      # points at the package rather than at the version of npm.
      - name: Install a new enough npm
        run: npm install -g npm@11
      # The package is a launcher and has no build step; its tests ran in
      # `ci.yml` and are run again here for the same reason `rehearse` runs
      # the Rust suite — a tag is neither a push to main nor a pull request.
      - name: Test the launcher
        run: node --test
        working-directory: packaging/npm
      # `--access public`, because a scoped package is private by default and
      # a private package is not one anybody can `npx`. The dist-tag is what
      # `npm install` with no version picks, so a pre-release goes somewhere
      # else — the same rule the container image's `:latest` follows. No
      # `--provenance`: publishing over OIDC attests on its own, and passing
      # the flag as well would only be a second way to say it.
      - name: Publish
        working-directory: packaging/npm
        run: |
          case "${GITHUB_REF_NAME#v}" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          npm publish --access public --tag "$tag"

  image:
    name: Container image (${{ matrix.platform }})
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      # `GITHUB_TOKEN` can write this repository's own packages, so the
      # container registry is the one publishing step that needs no secret of
      # its own.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: amd64
          - os: ubuntu-24.04-arm
            platform: arm64
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      # Each architecture is built on a runner of that architecture rather than
      # emulated, so the build is the one the users of that architecture get
      # and takes minutes rather than an hour.
      - name: Settle the version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build
        run: docker build -t "$IMAGE:$VERSION-${{ matrix.platform }}" .
      # The same check `ci.yml` runs, against the image about to be pushed:
      # what is published has been started and asked a question, on both
      # architectures.
      - name: Check
        run: scripts/check-container-image.sh "$IMAGE:$VERSION-${{ matrix.platform }}"
      - name: Sign in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push
        run: docker push "$IMAGE:$VERSION-${{ matrix.platform }}"

  image-manifest:
    name: Container image
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Sign in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # The two per-architecture tags are what was pushed; this is what people
      # pull. `docker pull ghcr.io/…/tailscale-mcp` then picks the right one
      # for the machine doing the pulling.
      - name: Join the two architectures under one tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          # `latest` means the newest release, and a pre-release is not that.
          case "$version" in
            *-*) tags="$version" ;;
            *) tags="$version latest" ;;
          esac
          for tag in $tags; do
            docker buildx imagetools create -t "$IMAGE:$tag" \
              "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
          done

  registry:
    name: Publish to the MCP registry
    # After both packages it offers: the registry pulls each one and looks for
    # this server's name inside, so a listing published first would be a
    # listing the registry cannot verify. It does not gate crates.io — the
    # registry is in preview, and an outage there should not stop a release.
    needs: [npm, image-manifest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The registry accepts a GitHub Actions identity token in place of a
      # secret, and the namespace it grants is `io.github.<owner>` — which is
      # exactly the name this listing carries.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # The version and the digest are in the script, which `rehearse` runs
      # too: it validated this same listing before anything was created.
      - name: Install the publisher
        run: scripts/install-mcp-publisher.sh
      - name: Sign in
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish

  publish:
    name: Publish to crates.io
    # After everything that can be undone: a crates.io upload cannot be taken
    # back, where a GitHub release can be deleted, an npm package unpublished
    # within its first days, and a container tag removed. It shares its
    # `needs:` with the MCP registry rather than waiting for it, so the two run
    # together — Q118 declined to let a preview registry's outage stop a
    # release, and a listing there is replaceable in a way a crate is not.
    needs: [release, npm, image-manifest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # crates.io exchanges this workflow's identity token for a publishing
      # token good for thirty minutes, and covering every crate whose trusted
      # publisher names this workflow — which is what lets one exchange upload
      # all three.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # Last, and deliberately: the token lives thirty minutes, and the
      # toolchain install above can take several of them. Minted here, the
      # whole of that life is available to the upload. The action revokes it
      # when the job ends, so it does not outlive the release either.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # `--workspace` uploads the three in dependency order and refuses to
      # start if any of them would fail, which is what keeps them at one
      # version.
      #
      # The step's own timeout is under the token's life so that a publish
      # which hangs fails saying so, rather than running on until the
      # credential expires underneath it and failing somewhere in the middle
      # of three crates.
      - name: Publish
        timeout-minutes: 25
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked
