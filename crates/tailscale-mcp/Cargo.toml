[package]
name = "tailscale-mcp"
description = "MCP server for Tailscale: the local node through the CLI, the tailnet through the control-plane API"
keywords = ["tailscale", "mcp", "model-context-protocol", "agent", "tailnet"]
categories = ["command-line-utilities", "network-programming"]
default-run = "tailscale-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
tailscale-rest.workspace = true
tailscale-cli.workspace = true

rmcp = { workspace = true, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Feature unification means the stub backend is present when building tests and
# absent from the release binary.
tailscale-cli = { workspace = true, features = ["testing"] }
# The client half of the SDK, so that the integration tests drive the server
# through the protocol rather than through its own types.
rmcp = { workspace = true, features = ["client"] }
tempfile.workspace = true
# The fake control plane, so the tailnet tools are tested against HTTP rather
# than against a stand-in for the client that talks it.
tailscale-rest = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
