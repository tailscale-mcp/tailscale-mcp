[package]
name = "tailscale-rest"
description = "Typed client for the Tailscale control-plane REST API v2"
keywords = ["tailscale", "api", "client", "tailnet"]
categories = ["api-bindings", "network-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
# A control plane that answers on a loopback socket. Enabled by dependents'
# dev-dependencies, so it is compiled for tests and never for a release binary.
testing = ["tokio/net", "tokio/rt", "tokio/io-util", "tokio/macros"]

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
# The fake control plane needs a socket and a runtime, which the crate itself
# does not; enabling them here keeps them out of a release build.
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "io-util", "macros"] }
# The federated credential is a file on disk, so testing it needs one.
tempfile.workspace = true
